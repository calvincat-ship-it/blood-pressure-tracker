<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6690">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>血壓記錄</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1>血壓記錄</h1>
  <div class="header-actions">
    <button id="shareBtn" class="icon-btn" title="分享紀錄" aria-label="分享紀錄">📤</button>
    <div class="export-menu-wrapper">
      <button id="exportBtn" class="icon-btn" title="匯出 CSV" aria-label="匯出 CSV">⬇</button>
      <div id="exportMenu" class="export-menu" hidden>
        <button type="button" class="export-menu-item" data-range="all">全部</button>
        <button type="button" class="export-menu-item" data-range="30">最近 30 天</button>
        <button type="button" class="export-menu-item" data-range="custom">設定日期</button>
        <div id="exportCustomRange" class="export-custom-range" hidden>
          <label>起始日期
            <input type="date" id="exportStart">
          </label>
          <label>結束日期
            <input type="date" id="exportEnd">
          </label>
          <button type="button" id="exportConfirmBtn" class="primary-btn">匯出 CSV</button>
        </div>
      </div>
    </div>
    <button id="settingsBtn" class="icon-btn" title="設定" aria-label="設定">⚙</button>
  </div>
</header>

<main>
  <section class="card reminder-card" id="reminderCard" hidden>
    <p id="reminderText"></p>
    <div class="reminder-actions">
      <button type="button" id="reminderSendBtn" class="primary-btn">立即寄送</button>
      <button type="button" id="reminderLaterBtn" class="secondary-btn">稍後提醒</button>
      <button type="button" id="reminderSkipBtn" class="text-danger-btn">略過本次</button>
    </div>
  </section>

  <section class="card summary-card" id="summaryCard">
    <div class="summary-item">
      <span class="summary-label">最近一次</span>
      <span class="summary-value" id="latestValue">—</span>
      <span class="summary-tag" id="latestTag"></span>
    </div>
    <div class="summary-item">
      <span class="summary-label">近 7 天平均</span>
      <span class="summary-value" id="avgValue">—</span>
    </div>
  </section>

  <section class="card">
    <div class="chart-header">
      <h2>趨勢圖</h2>
      <select id="chartRange">
        <option value="14">近 14 筆</option>
        <option value="30" selected>近 30 筆</option>
        <option value="9999">全部</option>
      </select>
    </div>
    <div class="form-row">
      <label>起始日期
        <input type="date" id="chartFilterStart">
      </label>
      <label>結束日期
        <input type="date" id="chartFilterEnd">
      </label>
    </div>
    <canvas id="trendChart" height="180"></canvas>
    <div class="legend">
      <span><i class="dot systolic"></i>收縮壓</span>
      <span><i class="dot diastolic"></i>舒張壓</span>
      <span><i class="dot pulse"></i>心跳</span>
    </div>
  </section>

  <section class="card">
    <h2>新增紀錄</h2>
    <form id="entryForm">
      <input type="hidden" id="editId">
      <div class="form-row">
        <label>日期
          <input type="date" id="fieldDate" required>
        </label>
        <label>時間
          <input type="time" id="fieldTime" required>
        </label>
      </div>
      <div class="form-row three">
        <label>收縮壓 <span class="unit">mmHg</span>
          <input type="number" id="fieldSystolic" inputmode="numeric" min="50" max="260" required>
        </label>
        <label>舒張壓 <span class="unit">mmHg</span>
          <input type="number" id="fieldDiastolic" inputmode="numeric" min="30" max="200" required>
        </label>
        <label>心跳 <span class="unit">bpm</span>
          <input type="number" id="fieldPulse" inputmode="numeric" min="30" max="220">
        </label>
      </div>
      <div class="form-row">
        <label>時段
          <select id="fieldTag">
            <option value="">未指定</option>
            <option value="起床">起床</option>
            <option value="睡前">睡前</option>
            <option value="飯後">飯後</option>
            <option value="運動後">運動後</option>
            <option value="其他">其他</option>
          </select>
        </label>
      </div>
      <label class="full">備註
        <input type="text" id="fieldNote" maxlength="60" placeholder="選填">
      </label>
      <div class="photo-row">
        <button type="button" id="photoCaptureBtn" class="secondary-btn">📷 拍攝照片</button>
        <input type="file" accept="image/*" capture="environment" id="fieldPhotoInput" hidden>
        <div id="photoPreviewWrap" class="photo-preview-wrap" hidden>
          <img id="photoPreview" alt="照片預覽">
          <button type="button" id="removePhotoBtn" class="text-danger-btn">移除照片</button>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="primary-btn" id="submitBtn">新增紀錄</button>
        <button type="button" class="secondary-btn" id="cancelEditBtn" hidden>取消編輯</button>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="chart-header">
      <button type="button" id="historyToggleBtn" class="section-toggle" aria-expanded="true">
        <span id="historyToggleIcon">▾</span> 歷史紀錄
      </button>
      <button type="button" id="clearAllBtn" class="text-danger-btn">清除全部</button>
    </div>
    <div id="historyBody">
      <div class="form-row">
        <label>起始日期
          <input type="date" id="historyFilterStart">
        </label>
        <label>結束日期
          <input type="date" id="historyFilterEnd">
        </label>
      </div>
      <div id="historyList" class="history-list"></div>
      <p id="emptyState" class="empty-state" hidden>尚無紀錄，開始新增第一筆血壓記錄吧！</p>
    </div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<div id="settingsModal" class="modal-backdrop" hidden>
  <div class="modal-sheet">
    <div class="modal-header">
      <h2>設定</h2>
      <button type="button" id="closeSettingsBtn" class="icon-btn" aria-label="關閉">✕</button>
    </div>
    <form id="settingsForm">
      <label class="full">收件 Email
        <input type="email" id="settingEmail" placeholder="you@example.com">
      </label>
      <label class="full">寄送頻率
        <select id="settingFrequency">
          <option value="weekly">每週</option>
          <option value="monthly">每月</option>
          <option value="custom">固定天數</option>
        </select>
      </label>
      <label class="full" id="customDaysRow" hidden>間隔天數
        <input type="number" id="settingCustomDays" min="1" max="365" value="14">
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="settingAutoClear">
        傳送完成後自動清除舊紀錄
      </label>
      <p class="settings-meta" id="lastSentInfo"></p>
      <div class="form-actions">
        <button type="submit" class="primary-btn">儲存設定</button>
        <button type="button" id="sendNowBtn" class="secondary-btn">立即寄送一次</button>
      </div>
    </form>
  </div>
</div>

<div id="photoViewer" class="modal-backdrop photo-viewer" hidden>
  <div class="photo-viewer-inner">
    <button type="button" id="closePhotoViewerBtn" class="icon-btn" aria-label="關閉">✕</button>
    <img id="photoViewerImg" alt="血壓照片">
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
